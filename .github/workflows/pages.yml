# Publish the collection as a JupyterLite site on GitHub Pages, but only
# after the test workflow has passed on main, so nothing reaches the site
# that has not been linted and self-tested on both frontends. The
# workflow_run trigger fires when test finishes; the build job runs only
# when it finished successfully, and checks out the exact commit test ran
# on rather than whatever main points at by then.
#
# The build is the same as `just site`. No trust level is forced, so
# opening a workshop on the site shows the trust dialog, where the Binder
# image removes it. A Binder session is a container somewhere else that
# is thrown away. A JupyterLite site runs inside the visitor's own
# browser, on their network, so code in the tab can send requests to
# whatever that browser can reach, their local network included, and
# that is theirs to allow.
# `--collection collection.json` has the build carry the index inside the
# site and subscribe the workshop browser to it there, so the workshops
# are listed numbered in the collection's order rather than
# alphabetically, and the build does not need to know the address the
# site is served from. With fourteen workshops and none to open on
# start, the build also has the site start in the workshop browser, so
# the site's own address is all a link needs.
#
# `--settings lite/settings.json` builds the analytics block into the
# site, so sessions report anonymous progress events to the workshops'
# own analytics service as the Binder and Codespaces ones do. The token
# in it is public by construction, since the site is, and only routes
# events to the collection under a label naming the site; the service
# lets it post from this site's origin and no other. `--welcome
# lite/welcome.md` carries the message a visitor is greeted with, which
# tells them that progress is reported.
name: pages

on:
  workflow_run:
    workflows: [test]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one part way: a half
# published site is worse than an old one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - uses: actions/configure-pages@v5

      - name: Install the locked environment
        run: uv sync

      - name: Build the JupyterLite site
        run: |
          set -euo pipefail
          uv run jupyter workshop lite workshops/*/ \
            --out dist \
            --no-terminal \
            --collection collection.json \
            --settings lite/settings.json \
            --welcome lite/welcome.md

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
