apiVersion: jupyterlab-workshop/v1alpha1
name: decorators-that-take-arguments
title: Decorators that take arguments
version: 0.1.0
description: Make a decorator work on any function, then make it configurable. Forward arguments with *args and **kwargs, add the extra layer that @repeat(3) needs, build a retry worth keeping, and handle a decorator used with and without parentheses.
authors: [Graham Dumpleton]
tags: [python, decorators]
duration: 15m
platforms: [linux, macos, windows]
frontends: [jupyterlab, jupyterlite]
capabilities:
  - write-files
  - kernel-exec
layout: notebook
layouts:
  notebook:
    main:
      areas:
        - { name: notebook, tabs: [] }
gating: soft
finish: |
  Your decorators now fit any function and take arguments of their own,
  which is most of what you need to write useful ones.

  Next is **Preserving the wrapped function**, which is short and shows
  you something every decorator you have written so far has been quietly
  breaking, along with the one line that fixes it.

  [functools](https://docs.python.org/3/library/functools.html)
  documents `partial`, which is one of the tidier ways to write a
  decorator that works with and without parentheses.
variables:
  - name: notebook
    type: path
    default: decorators-that-take-arguments.ipynb
    description: The notebook the exercises are done in
pages:
  - pages/01-welcome.md
  - pages/02-any-signature.md
  - pages/03-the-extra-layer.md
  - pages/04-a-retry-worth-keeping.md
  - pages/05-with-and-without-parentheses.md
  - pages/06-finish.md
